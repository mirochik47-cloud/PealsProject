```yaml
name: Build Peals Project IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    env:
      BUNDLE_ID: app.coral8757.pisces1195
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Import signing certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          P1: ${{ secrets.IOS_PROFILE_B64_1 }}
          P2: ${{ secrets.IOS_PROFILE_B64_2 }}
          P3: ${{ secrets.IOS_PROFILE_B64_3 }}
          P4: ${{ secrets.IOS_PROFILE_B64_4 }}
          P5: ${{ secrets.IOS_PROFILE_B64_5 }}
          P6: ${{ secrets.IOS_PROFILE_B64_6 }}
          P7: ${{ secrets.IOS_PROFILE_B64_7 }}
          P8: ${{ secrets.IOS_PROFILE_B64_8 }}
          P9: ${{ secrets.IOS_PROFILE_B64_9 }}
        run: |
          set -euo pipefail

          PROFILE_PATH="$RUNNER_TEMP/peals.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          printf '%s' "$P1$P2$P3$P4$P5$P6$P7$P8$P9" \
            | base64 -D > "$PROFILE_PATH"

          echo "Decoded profile size: $(wc -c < "$PROFILE_PATH") bytes"

          openssl cms -verify -inform DER \
            -in "$PROFILE_PATH" \
            -noverify \
            -out "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print :UUID' "$PROFILE_PLIST")

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c 'Print :Name' "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Provisioning profile installed."

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Ensure asset catalog metadata
        run: |
          set -euo pipefail

          ASSETS="PealsProject/Assets.xcassets"
          mkdir -p "$ASSETS"

          if [ ! -f "$ASSETS/Contents.json" ]; then
            cat > "$ASSETS/Contents.json" <<'EOF'
          {
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("PealsProject/Assets.xcassets")
          for path in root.rglob("Contents.json"):
              with path.open() as f:
                  json.load(f)
              print("Valid asset metadata:", path)
          PY

      - name: Create archive
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/archive.log"

          xcodebuild \
            -project PealsProject.xcodeproj \
            -scheme PealsProject \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PealsProject.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive 2>&1 | tee "$LOG"

          result=${PIPESTATUS[0]}

          if [ "$result" -ne 0 ]; then
            echo "===== Relevant build errors ====="
            grep -n -i -E \
              'error:|actool|Assets.xcassets|failed|warning:' \
              "$LOG" | tail -100 || true
            exit "$result"
          fi

      - name: Prepare export options
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "method": "ad-hoc",
              "teamID": os.environ["TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]
              }
          }

          with open("ExportOptions.plist", "wb") as f:
              plistlib.dump(options, f)
          PY

      - name: Export IPA
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PealsProject.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PealsProject-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7
```

