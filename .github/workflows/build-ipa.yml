name: Build Peals Project IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    env:
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      BUNDLE_ID: app.coral8757.pisces1195

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Import Apple signing certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          P1: ${{ secrets.IOS_PROFILE_B64_1 }}
          P2: ${{ secrets.IOS_PROFILE_B64_2 }}
          P3: ${{ secrets.IOS_PROFILE_B64_3 }}
          P4: ${{ secrets.IOS_PROFILE_B64_4 }}
          P5: ${{ secrets.IOS_PROFILE_B64_5 }}
          P6: ${{ secrets.IOS_PROFILE_B64_6 }}
          P7: ${{ secrets.IOS_PROFILE_B64_7 }}
          P8: ${{ secrets.IOS_PROFILE_B64_8 }}
          P9: ${{ secrets.IOS_PROFILE_B64_9 }}
        shell: bash
        run: |
          set -euo pipefail

          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          PLIST="$RUNNER_TEMP/profile.plist"

          printf '%s' "$P1$P2$P3$P4$P5$P6$P7$P8$P9" | base64 -D > "$PROFILE"

          openssl cms -verify -inform DER \
            -in "$PROFILE" -noverify -out "$PLIST"

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Provisioning profile installed."

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

            - name: Validate asset catalog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("PealsProject/Assets.xcassets")
          icon = root / "AppIcon.appiconset"
          png = icon / "PealsIcon.png"

          root.mkdir(parents=True, exist_ok=True)
          (root / "Contents.json").write_text(
              json.dumps({"info": {"author": "xcode", "version": 1}}, indent=2)
          )

          assert png.is_file(), f"Missing icon: {png}"
          data = json.loads((icon / "Contents.json").read_text())
          assert any(
              image.get("filename") == "PealsIcon.png"
              for image in data.get("images", [])
          ), "AppIcon Contents.json does not reference PealsIcon.png"

          print("AppIcon asset validated:", png)
          PY
        shell: bash
        run: |
          set -uo pipefail

          xcodebuild \
            -project PealsProject.xcodeproj \
            -scheme PealsProject \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PealsProject.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log"

          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo "===== BUILD ERRORS ====="
            grep -n -E 'error:|fatal error:|BUILD FAILED|ARCHIVE FAILED|error generated' \
              "$RUNNER_TEMP/archive.log" | tail -80 || true
            exit "$result"
          fi

      - name: Create export options
        run: |
          python3 -c 'import os,plistlib; d={"method":"ad-hoc","teamID":os.environ["TEAM_ID"],"signingStyle":"manual","signingCertificate":"Apple Distribution","provisioningProfiles":{os.environ["BUNDLE_ID"]:os.environ["PROFILE_NAME"]}}; plistlib.dump(d,open("ExportOptions.plist","wb"))'

      - name: Export IPA
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PealsProject.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PealsProject-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7
